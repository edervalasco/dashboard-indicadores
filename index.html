<!DOCTYPE html>
<html lang="pt-BR">
 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard de Indicadores</title>
 
<script/cdn.jsdelivr.net/npm/chart.jsscript>
 
<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
}
 
body {
font-family: Arial, sans-serif;
background-color: #f4f6f9;
padding: 30px;
}
 
h1 {
margin-bottom: 25px;
color: #333;
}
 
.cards {
display: flex;
gap: 20px;
margin-bottom: 30px;
flex-wrap: wrap;
}
 
.card {
background: white;
padding: 20px;
border-radius: 12px;
min-width: 220px;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
 
.card h3 {
color: #666;
margin-bottom: 10px;
}
 
.valor {
font-size: 36px;
font-weight: bold;
color: #0078D4;
}
 
.grafico {
background: white;
padding: 20px;
border-radius: 12px;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
margin-bottom: 30px;
}
 
table {
width: 100%;
background: white;
border-collapse: collapse;
border-radius: 12px;
overflow: hidden;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
 
th {
background: #0078D4;
color: white;
}
 
th, td {
padding: 12px;
text-align: center;
border: 1px solid #ddd;
}
 
tr:hover {
background-color: #f5f5f5;
}
</style>
 
</head>
 
<body>
 
<h1>📊 Dashboard Regional</h1>
 
<div class="cards">
 
<div class="card">
<h3>Previsto</h3>
<div class="valor">300</div>
</div>
 
<div class="card">
<h3>Realizado</h3>
<div class="valor">283</div>
</div>
 
<div class="card">
<h3>Aderência</h3>
<div class="valor">94,3%</div>
</div>
 
</div>
 
<div class="grafico">
<h2>Aderência por Regional</h2>
<br>
<canvas id="graficoRegional"></canvas>
</div>
 
<table>
<thead>
<tr>
<th>Regional</th>
<th>Previsto</th>
<th>Realizado</th>
<th>%</th>
</tr>
</thead>
 
<tbody>
<tr>
<td>Norte</td>
<td>100</td>
<td>95</td>
<td>95%</td>
</tr>
 
<tr>
<td>Centro</td>
<td>120</td>
<td>118</td>
<td>98%</td>
</tr>
 
<tr>
<td>Sul</td>
<td>80</td>
<td>70</td>
<td>88%</td>
</tr>
</tbody>
</table>
 
<script>
 
const ctx = document.getElementById('graficoRegional');
 
new Chart(ctx, {
type: 'bar',
data: {
labels: ['Norte', 'Centro', 'Sul'],
datasets: [{
label: 'Aderência (%)',
data: [95, 98, 88],
backgroundColor: [
'#0078D4',
'#00B050',
'#FFC000'
],
borderWidth: 1
}]
},
options: {
responsive: true,
plugins: {
legend: {
display: true
}
},
scales: {
y: {
beginAtZero: true,
max: 100
}
}
}
});
 
</script>
 
</body>
 
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 
<title>Dashboard de Indicadores</title>
 
<style>
 
body{
font-family: Arial, sans-serif;
background:#f4f6f9;
margin:0;
padding:20px;
}
 
h1{
color:#333;
}
 
.cards{
display:flex;
gap:20px;
margin-bottom:30px;
}
 
.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,0.1);
width:250px;
}
 
.card h3{
margin:0;
color:#666;
}
 
.valor{
font-size:36px;
font-weight:bold;
color:#0078D4;
}
 
table{
width:100%;
border-collapse:collapse;
background:white;
}
 
th{
background:#0078D4;
color:white;
}
 
th, td{
border:1px solid #ddd;
padding:10px;
text-align:center;
}
 
</style>
 
</head>
 
<body>
 
<h1>Dashboard Regional</h1>
 
<div class="cards">
 
<div class="card">
<h3>Previsto</h3>
<div class="valor">1200</div>
</div>
 
<div class="card">
<h3>Realizado</h3>
<div class="valor">1145</div>
</div>
 
<div class="card">
<h3>Aderência</h3>
<div class="valor">95,4%</div>
</div>
 
</div>
 
<table>
 
<thead>
<tr>
<th>Regional</th>
<th>Previsto</th>
<th>Realizado</th>
<th>%</th>
</tr>
</thead>
 
<tbody>
 
<tr>
<td>Norte</td>
<td>100</td>
<td>95</td>
<td>95%</td>
</tr>
 
<tr>
<td>Centro</td>
<td>120</td>
<td>118</td>
<td>98%</td>
</tr>
 
<tr>
<td>Sul</td>
<td>80</td>
<td>70</td>
<td>88%</td>
</tr>
 
</tbody>
 
</table>
 
</body>
</html>
